services:
  spy-look:
    build: .
    image: spy-look:latest
    container_name: spy-look
    ports:
      - "${SPY_LOOK_PORT:-8000}:8000"
    environment:
      SPY_LOOK_DATA_DIR: /data
    volumes:
      # SQLite + video_tools_config.json + settings_config.json
      - spy-look-data:/data
      # 图片工具 ONNX 模型（可选；缺失时 OCR/公式/版面接口会提示路径）
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  spy-look-data:
